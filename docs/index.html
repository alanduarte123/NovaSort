<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaSort Visualizer - Algoritmos de Ordenamiento</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1 class="title">NovaSort Visualizer</h1>
            <p class="subtitle">Visualizador interactivo de algoritmos de ordenamiento</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="algorithm">Algoritmo</label>
                <select id="algorithm">
                    <option value="novasuper">NovaSuper v1</option>
                    <option value="novasort">NovaSort v3</option>
                    <option value="radix">Radix LSD</option>
                    <option value="quick">Quick Sort</option>
                </select>
            </div>

            <div class="control-group">
                <label for="arraySize">Tamaño</label>
                <input type="range" id="arraySize" min="10" max="100" value="50" step="5">
                <span id="sizeValue">50</span>
            </div>

            <div class="control-group">
                <label for="speed">Velocidad</label>
                <input type="range" id="speed" min="1" max="50" value="15" step="1">
                <span id="speedValue">15</span>
            </div>

            <div class="buttons">
                <button id="generate" class="btn btn-secondary">Generar Array</button>
                <button id="play" class="btn btn-primary">▶️ Reproducir</button>
                <button id="pause" class="btn btn-secondary" disabled>⏸️ Pausar</button>
                <button id="step" class="btn btn-secondary">⏭️ Paso</button>
                <button id="reset" class="btn btn-secondary">🔄 Reset</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Comparaciones:</span>
                <span id="comparisons" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Intercambios:</span>
                <span id="swaps" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Estado:</span>
                <span id="status" class="stat-value">Listo</span>
            </div>
        </div>

        <div class="visualization-container">
            <div id="bars" class="bars"></div>
        </div>

        <div class="pseudocode">
            <h3>Pseudocódigo</h3>
            <pre id="pseudocode">Selecciona un algoritmo para ver el pseudocódigo</pre>
        </div>

        <div class="code-section">
            <h3>Código fuente</h3>
            <div class="tabs">
                <button class="tab-button active" data-tab="python">Python</button>
                <button class="tab-button" data-tab="javascript">JavaScript</button>
                <button class="tab-button" data-tab="c">C</button>
                <button class="tab-button" data-tab="java">Java</button>
                <button class="tab-button" data-tab="php">PHP</button>
            </div>
            <div id="tab-python" class="tab-content active">
                <pre class="code-block"><code id="code-python"># Código Python</code></pre>
            </div>
            <div id="tab-javascript" class="tab-content">
                <pre class="code-block"><code id="code-javascript">// Código JavaScript</code></pre>
            </div>
            <div id="tab-c" class="tab-content">
                <pre class="code-block"><code id="code-c">// Código C</code></pre>
            </div>
            <div id="tab-java" class="tab-content">
                <pre class="code-block"><code id="code-java">// Código Java</code></pre>
            </div>
            <div id="tab-php" class="tab-content">
                <pre class="code-block"><code id="code-php">// Código PHP</code></pre>
            </div>
        </div>
    </div>

    <script src="visualizer.js"></script>
</body>

</html>
