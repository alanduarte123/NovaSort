<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaSort Visualizer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header class="header"><h1 class="title">NovaSort Visualizer</h1></header>
<div class="controls">
  <div class="control-group">
    <label>Algoritmo</label>
    <select id="algorithm">
      <option value="quick">Quick Sort</option>
      <option value="novasuper">NovaSuper v1</option>
      <option value="novasort">NovaSort v3</option>
      <option value="radix">Radix LSD</option>
    </select>
  </div>
  <div class="control-group">
    <label>Tamaño</label>
    <input type="range" id="arraySize" min="10" max="40" value="20" step="1">
    <span id="sizeValue">20</span>
  </div>
  <div class="control-group">
    <label>Velocidad</label>
    <input type="range" id="speed" min="5" max="60" value="30" step="5">
    <span id="speedValue">30</span>
  </div>
  <div class="buttons">
    <button id="generate" class="btn btn-secondary">Generar</button>
    <button id="play" class="btn btn-primary">▶ Reproducir</button>
    <button id="pause" class="btn btn-secondary" disabled>⏸ Pausar</button>
    <button id="step" class="btn btn-secondary">⏭ Paso</button>
    <button id="reset" class="btn btn-secondary">🔄 Reset</button>
  </div>
</div>
<div class="stats">
  <div class="stat-item"><span class="stat-label">Comparaciones:</span><span id="comparisons" class="stat-value">0</span></div>
  <div class="stat-item"><span class="stat-label">Intercambios:</span><span id="swaps" class="stat-value">0</span></div>
  <div class="stat-item"><span class="stat-label">Estado:</span><span id="status" class="stat-value">Listo</span></div>
</div>
<div class="visualization-container"><div id="bars" class="bars"></div></div>
<div class="pseudocode"><h3>Pseudocódigo</h3><pre id="pseudocode"></pre></div>
<div class="code-section">
  <h3>Código</h3>
  <div class="tabs">
    <button class="tab-button active" data-tab="python">Python</button>
    <button class="tab-button" data-tab="javascript">JS</button>
    <button class="tab-button" data-tab="c">C</button>
    <button class="tab-button" data-tab="java">Java</button>
    <button class="tab-button" data-tab="php">PHP</button>
  </div>
  <div id="tab-python" class="tab-content active"><pre class="code-block"><code id="code-python"></code></pre></div>
  <div id="tab-javascript" class="tab-content"><pre class="code-block"><code id="code-javascript"></code></pre></div>
  <div id="tab-c" class="tab-content"><pre class="code-block"><code id="code-c"></code></pre></div>
  <div id="tab-java" class="tab-content"><pre class="code-block"><code id="code-java"></code></pre></div>
  <div id="tab-php" class="tab-content"><pre class="code-block"><code id="code-php"></code></pre></div>
</div>
</div>
<script src="algo.js"></script>
<script src="app.js"></script>
</body>
</html>
